name: 同步上游仓库
on:
  schedule:
    # UTC 18:00, 00:00, 06:00, 12:00 对应北京时间 2:00, 8:00, 14:00, 20:00
    - cron: '0 18,0,6,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 设置Git信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游
        run: |
          git remote add upstream https://github.com/kuke31/xmlgz.git || true
          git fetch upstream

      - name: 完全镜像上游（保留 .github）
        run: |
          # 1. 备份自己的 .github（上游没有，必须保住）
          rm -rf /tmp/my_github
          cp -r .github /tmp/my_github

          # 2. 完全对齐上游
          git reset --hard upstream/main

          # 3. 还原自己的 .github
          rm -rf .github
          cp -r /tmp/my_github .github

          # 4. 提交
          git add -A
          git commit -m "同步上游（保留自定义 .github）" || echo "无变化，跳过提交"

      - name: 生成状态文件（北京时间）
        run: |
          TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          echo "【已同步】$TIME | 已对齐上游最新代码" > 更新时间说明.txt

      - name: 提交状态文件
        run: |
          git add 更新时间说明.txt
          git commit -m "更新同步状态 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" || echo "状态文件无变化，无需提交"

      - name: 推送到自己仓库
        uses: ad-m/github-push-action@master
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true